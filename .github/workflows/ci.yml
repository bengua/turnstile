name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install "ruff==0.16.6" "pytest>=8"
      - name: Lint and test (no GPU, no Docker needed)
        run: ./verify.sh
